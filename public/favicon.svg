<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fundo escuro (cor primária da barbearia) -->
  <rect width="32" height="32" rx="6" fill="#0D0D0D"/>
  <!-- Argola superior da tesoura -->
  <circle cx="7" cy="10" r="4" fill="none" stroke="#B8960C" stroke-width="2"/>
  <!-- Argola inferior da tesoura -->
  <circle cx="7" cy="22" r="4" fill="none" stroke="#B8960C" stroke-width="2"/>
  <!-- Lâmina superior -->
  <line x1="10.5" y1="11.5" x2="27" y2="16" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
  <!-- Lâmina inferior -->
  <line x1="10.5" y1="20.5" x2="27" y2="16" stroke="#B8960C" stroke-width="2" stroke-linecap="round"/>
  <!-- Parafuso central (pivô) -->
  <circle cx="19" cy="16" r="2" fill="#0D0D0D" stroke="#B8960C" stroke-width="1.5"/>
</svg>
